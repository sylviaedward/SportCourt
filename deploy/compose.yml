name: sportcourt-cloud
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --innodb-buffer-pool-size=64M
      - --max-connections=30
      - --performance-schema=OFF
      - --table-open-cache=128
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    environment:
      MYSQL_ROOT_PASSWORD: ${SPORTCOURT_MYSQL_ROOT_PASSWORD:?Run init-env.sh first}
      MYSQL_DATABASE: sportcourt
      MYSQL_USER: sportcourt_app
      MYSQL_PASSWORD: ${SPORTCOURT_MYSQL_PASSWORD:?Run init-env.sh first}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sportcourt.sql:/docker-entrypoint-initdb.d/01-sportcourt.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 192m
    logging: *logging
    environment:
      REDIS_PASSWORD: ${SPORTCOURT_REDIS_PASSWORD:?Run init-env.sh first}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync always --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    command: [memcached, -m, '32', -I, 2m]
  image-init:
    image: nginx:alpine
    mem_limit: 64m
    logging: *logging
    entrypoint: [/bin/sh]
    command: [/init-images.sh]
    volumes:
      - ./images:/seed:ro
      - ./init-images.sh:/init-images.sh:ro
      - uploads:/uploads
  java:
    image: sportcourt-cloud-java:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: '-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m'
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sportcourt?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: sportcourt_app
      SPRING_DATASOURCE_PASSWORD: ${SPORTCOURT_MYSQL_PASSWORD:?Run init-env.sh first}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '8'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '2'
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: '6379'
      SPRING_REDIS_PASSWORD: ${SPORTCOURT_REDIS_PASSWORD:?Run init-env.sh first}
      SPORTCOURT_MEMCACHE_ENABLED: 'true'
      SPORTCOURT_MEMCACHE_HOST: memcached
      SPORTCOURT_CDC_ENABLED: 'false'
      SPORTCOURT_MQ_ENABLED: 'false'
      SPORTCOURT_MQ_GOLDEN_SLOT_ENABLED: 'false'
      SPORTCOURT_ANALYTICS_ENABLED: 'false'
      SPORTCOURT_EXPERIENCE_ENABLED: 'true'
      SPORTCOURT_MONITOR_TOKEN: ${SPORTCOURT_MONITOR_TOKEN:?Run init-env.sh first}
      SPORTCOURT_UPLOAD_DIR: /uploads
      SPORTCOURT_CATALOG_ADMIN_IDS: ${SPORTCOURT_ADMIN_IDS:-}
      SPORTCOURT_PAYMENT_MOCK_ENABLED: ${SPORTCOURT_PAYMENT_MOCK_ENABLED:-false}
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_started
      image-init:
        condition: service_completed_successfully
  web:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    ports:
      - '0.0.0.0:${SPORTCOURT_WEB_PORT:-8080}:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - uploads:/usr/share/nginx/sportcourt-images:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      java:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
  redis-data:
  uploads:
